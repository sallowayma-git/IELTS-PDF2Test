[package]
name = "ielts-author-studio"
version = "0.1.0"
description = "Epic 8 Tauri authoring app"
authors = ["IELTS Author Studio"]
edition = "2021"

[lib]
name = "ielts_author_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
pdf-extract = "0.10"
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "thread_safe"] }
png = "0.17"
quick-xml = "0.39"
zip = { version = "2.4.2", default-features = false, features = ["flate2", "deflate-flate2"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
# Aggressive size optimization for the shipped binary. LTO + single
# codegen-unit + symbol stripping keep the .exe small despite the pdfium-render
# and sqlite deps. Tauri's NSIS installer then compresses the .exe further.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
